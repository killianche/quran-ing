# Сборка и выгрузка iOS в App Store Connect на облачной macOS-машине.
#
# Зачем. Xcode существует только под macOS, поэтому архив нельзя собрать ни на
# сервере разработки (Ubuntu), ни где-либо ещё. Раньше это означало «владелец
# садится за Mac». Здесь ту же работу делает арендованный macOS-раннер GitHub:
# к ноутбуку никто не подходит, а всё, что до архива, уже проверено обычным
# Node — те же команды, что гоняются локально.
#
# Запуск только вручную (workflow_dispatch). Выпуск — намеренное действие, он
# не должен случаться от каждого push.
#
# ── Что нужно один раз настроить ──────────────────────────────────────────
#
# Settings → Secrets and variables → Actions → New repository secret:
#
#   ASC_ISSUER_ID   Issuer ID из App Store Connect → Users and Access →
#                   Integrations → App Store Connect API (общий на команду)
#   ASC_KEY_ID      Key ID выпущенного ключа (10 символов)
#   ASC_KEY_P8      СОДЕРЖИМОЕ файла AuthKey_XXXXXXXXXX.p8 целиком,
#                   вместе со строками -----BEGIN PRIVATE KEY-----
#
# Роль ключа — Admin. Не «на всякий случай»: с App Manager сборка доходит до
# архива и падает на экспорте с `Cloud signing permission error` — Apple
# требует Admin именно для облачной подписи распространения. Порядок выпуска
# ключа расписан в RELEASE.md.
#
# ── Чего этот сценарий НЕ делает ──────────────────────────────────────────
#
# Не поднимает номер сборки. `manageAppVersionAndBuildNumber` в
# ExportOptions-AppStore.plist выставлен в false намеренно: версия живёт в
# package.json (поля version и iosBuild) и попадает в проект осознанной
# правкой, а не автоматикой на раннере. Apple отвергает повторную загрузку
# уже существующего номера сборки — поэтому перед каждым выпуском iosBuild
# и CURRENT_PROJECT_VERSION поднимаются вручную.

name: iOS release

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Выгружать в App Store Connect (false — только собрать и проверить)'
        type: boolean
        default: false
      prune_certs:
        description: 'Отозвать сертификаты разработки «Created via API» (аккаунт общий с xtrud — только осознанно)'
        type: boolean
        default: false

concurrency:
  # Две одновременные сборки релиза не нужны никогда: они борются за один и
  # тот же номер сборки в App Store Connect.
  group: ios-release
  cancel-in-progress: false

jobs:
  build:
    # macos-26 — не «посвежее ради свежести»: Apple с 2026 года принимает
    # только сборки с SDK iOS 26 и новее. На macos-15 стоит Xcode с SDK
    # iOS 18.5, и выгрузка отклоняется на этапе проверки, уже ПОСЛЕ успешной
    # сборки и подписи — то есть впустую тратится весь прогон.
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Версию SDK печатаем ДО сборки: если образ раннера сменится и SDK
      # окажется старым, это будет видно сразу в логе, а не через десять
      # минут в отказе Apple.
      - name: Версия Xcode и SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Установить зависимости
        run: npm ci

      # Те же проверки, что и на сервере разработки. Гонятся до тяжёлой
      # сборки Xcode: падать дешевле рано.
      - name: Тесты
        run: npm test

      - name: Сакральный гард
        run: npm run check:sacred

      # Ловит подмену разметки одного издания мусхафа другим. Такая ошибка
      # не падает и не подсвечивается: страница откроется красивой, просто
      # не той, а переход к аяту промахнётся.
      - name: Разбивка страниц мусхафа
        run: npm run check:mushaf-pages

      - name: Сборка веба
        run: npm run build

      - name: Перенос веб-ассетов в нативный проект
        run: npx cap sync ios

      - name: Предполётная проверка релиза
        run: npm run check:ios-release

      # Ключ кладём во временный файл вне рабочего дерева: в репозитории ему
      # не место, и в артефакты сборки он попасть не должен.
      - name: Подготовить ключ App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_P8}" ]; then
            echo "Секрет ASC_KEY_P8 не задан — см. шапку этого файла и RELEASE.md"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/asc"
          printf '%s' "${ASC_KEY_P8}" > "${RUNNER_TEMP}/asc/AuthKey.p8"
          chmod 600 "${RUNNER_TEMP}/asc/AuthKey.p8"

      # 🔴 Проверка ДО архива, а не после: вышедшая версия закрывает свой
      # поезд, и Apple отвергает выгрузку словами «Invalid Pre-Release Train.
      # The train version 'X' is closed for new build submissions».
      # 08.09.2026 на этом сгорела сборка 25 — она прошла тесты, гард и всю
      # компиляцию Xcode и упала на самой выгрузке, потратив полный прогон.
      # Раньше шага здесь не было потому, что проверке нужен ключ Apple, а он
      # готовится ниже; теперь она стоит сразу после подготовки ключа.
      - name: Поезд версии свободен
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: node scripts/appstore/check-version-free.mjs

      # Перед архивом чистим сертификаты, которые выпустили прошлые сборки.
      # Каждый запуск идёт на чистой машине и выпускает новый; на тринадцатом
      # Apple отвечает «maximum number of certificates», и архив падает —
      # ровно это и случилось 05.09.2026. Подробности в самом скрипте.
      # 🔴 Аккаунт Apple у Quran Ing общий с приложением xtrud: сертификаты
      # «Created via API» обоих проектов неотличимы, а отзыв необратим.
      # Поэтому чистка — только по явной галочке prune_certs при запуске,
      # когда Apple начнёт отвечать «maximum number of certificates».
      - name: Чистка сертификатов прошлых сборок
        if: ${{ inputs.prune_certs }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
        run: node scripts/appstore/prune-dev-certs.mjs

      # -allowProvisioningUpdates разрешает Xcode самому получить сертификат и
      # profile через переданный ключ API. Это снимает необходимость выносить
      # сертификат с чужого Mac — чего удалённо всё равно не сделать.
      #
      # Имена флагов проверены на живом раннере: архив собрался и подписался
      # сертификатом, полученным по ключу («Apple Development: Created via
      # API» в логе запуска #1).
      - name: Архив
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${RUNNER_TEMP}/QuranIng.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${RUNNER_TEMP}/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      # В ExportOptions-AppStore.plist стоит destination=upload, поэтому этот
      # шаг и собирает .ipa, и отправляет его в App Store Connect. Отдельный
      # вызов altool не нужен — тем лучше, он у Apple объявлен устаревшим.
      - name: Экспорт и выгрузка
        if: ${{ inputs.upload }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "${RUNNER_TEMP}/QuranIng.xcarchive" \
            -exportOptionsPlist ios/ExportOptions-AppStore.plist \
            -exportPath "${RUNNER_TEMP}/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${RUNNER_TEMP}/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Убрать ключ
        if: always()
        run: rm -rf "${RUNNER_TEMP}/asc"

      # Логи Xcode при неудаче — единственный способ понять причину, не имея
      # доступа к машине. Сам архив весит за 300 МБ, поэтому сохраняем только
      # его описание и результаты экспорта.
      - name: Сохранить сведения о сборке
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-logs
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/QuranIng.xcarchive/Info.plist
            ${{ runner.temp }}/export/**
