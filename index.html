<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 + user-scalable=no: в нативной обёртке
         масштабирование страницы не нужно и только вредит.  Проверено
         на симуляторе: двойной тап по списку увеличивал вёрстку и
         оставлял её увеличенной — вернуть можно было только вторым
         двойным тапом, о котором никто не догадается.  Размер текста
         меняется настройками чтения, а не жестом по всему интерфейсу. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Quran Ing — чтение Корана с ингушским переводом и переводом Кулиева, аудио и азкары." />

    <title>Quran Ing</title>

    <!-- Медальон заставки — нужен с первого кадра (#launch ниже). -->
    <link rel="preload" as="image" href="/brand/medallion.webp" type="image/webp" />
    <!-- Шрифт подписи «Quran Ing» на заставке — без него первый кадр подписи
         рисуется запасным Georgia и затем перескакивает. -->
    <link rel="preload" as="font" href="/latin-fonts/EBGaramond-VariableFont_wght.woff2" type="font/woff2" crossorigin />

    <!-- #launch — копия системной заставки и сцена анимации появления
         (src/lib/launchReveal.ts). Стили инлайном: они нужны раньше, чем
         загрузится CSS приложения. Только transform/opacity — композитор,
         без перерисовки. Цвет поля #786747 — scripts/brand/design-logo.py. -->
    <style>
      /* Касания перехватываются, пока заставка видна: под ней уже живой
         главный экран, и случайный тап открыл бы суру вслепую. */
      #launch { position: fixed; inset: 0; z-index: 2147483000; background: #786747;
        overflow: hidden; touch-action: none; }
      #launch .launch-mark, #launch .launch-glow { position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%); will-change: transform, opacity; }
      #launch .launch-mark { width: var(--launch-size, 160px); height: var(--launch-size, 160px); }
      #launch .launch-glow { width: calc(var(--launch-size, 160px) * 2.6); height: calc(var(--launch-size, 160px) * 2.6);
        border-radius: 50%; opacity: 0;
        background: radial-gradient(closest-side, rgba(236, 200, 146, 0.30), rgba(236, 200, 146, 0.08) 55%, transparent 74%); }
      #launch .launch-name { position: absolute; left: 0; right: 0;
        top: calc(50% + var(--launch-size, 160px) * 0.66); text-align: center;
        font: 500 22px/1 'EB Garamond', Georgia, 'Times New Roman', serif;
        /* Разрядка статичная (анимация letter-spacing — перекладка текста
           каждый кадр); text-indent возвращает центр, сдвинутый хвостовым
           интервалом после последней буквы. */
        letter-spacing: 0.22em; text-indent: 0.22em;
        color: #f1dcbc; opacity: 0; transform: translateY(8px); will-change: transform, opacity; }

      #launch.launch--reveal { animation: launch-out 1250ms cubic-bezier(0.4, 0, 0.2, 1) forwards; }
      #launch.launch--reveal .launch-mark { animation: launch-mark 1250ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      #launch.launch--reveal .launch-glow { animation: launch-glow 1250ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      #launch.launch--reveal .launch-name { animation: launch-name 1250ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      #launch.launch--quick { animation: launch-out-quick 320ms ease-out forwards; }
      #launch .launch-failed { position: absolute; left: 24px; right: 24px;
        top: calc(50% + var(--launch-size, 160px) * 0.66 + 48px); text-align: center;
        font: 400 17px/1.35 -apple-system, system-ui, sans-serif; color: #fbf1e2; }
      #launch .launch-failed p { margin: 0 0 16px; }
      #launch .launch-failed button { min-height: 44px; padding: 0 22px; border: 0; border-radius: 22px;
        background: #fbf1e2; color: #3b2f1e; font: 600 17px/1 -apple-system, system-ui, sans-serif; }

      @keyframes launch-out { 0%, 54% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes launch-out-quick { from { opacity: 1; } to { opacity: 0; } }
      @keyframes launch-mark {
        0% { transform: translate(-50%, -50%) scale(1); }
        46% { transform: translate(-50%, -50%) scale(1.06); }
        100% { transform: translate(-50%, -50%) scale(1.34); } }
      @keyframes launch-glow {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
        46% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); } }
      @keyframes launch-name {
        0%, 14% { opacity: 0; transform: translateY(8px); }
        46% { opacity: 1; transform: translateY(0); }
        70% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-4px); } }
    </style>

    <!-- Favicon: generated from the same opaque logo.png as native apps. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />

    <!-- iOS home-screen icon. 180x180 is the modern Apple-recommended
         size; iOS Safari uses this when the user "Add to Home Screen". -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />

    <!-- PWA manifest — drives the install prompt on Android/desktop
         Chrome and the icon/title shown after install. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS PWA meta tags — hide Safari chrome when launched from the
         home screen, set the status-bar style, and give the standalone
         app its display title. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Quran Ing" />

    <!-- Open Graph / link-preview card. -->
    <meta property="og:title" content="Quran Ing" />
    <meta property="og:description" content="Чтение Корана с ингушским переводом и переводом Кулиева, аудио и азкары." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:type" content="website" />

    <!-- Arabic body text is rendered with QCF V4 PUA glyphs loaded
         on demand (per visible page) by useQcfFont — no preload of a
         single global font is needed any more. -->

  </head>
  <body>
    <!-- Копия системной заставки: тот же фон и тот же медальон в той же
         точке, поэтому снятие заставки незаметно. Убирается из DOM после
         анимации (src/lib/launchReveal.ts). -->
    <div id="launch" aria-hidden="true">
      <div class="launch-glow"></div>
      <img class="launch-mark" src="/brand/medallion.webp" alt="" decoding="async" />
      <div class="launch-name">Quran Ing</div>
    </div>
    <script>
      /* Размер медальона = как на системной заставке.
         iOS: LaunchScreen кладёт квадрат 1366 pt через aspectFill, медальон —
         splashScale (0.26) его стороны → 0.26 × длинная сторона экрана.
         Android: системная заставка (SplashScreen API) — медальон 192 dp.
         Сайт: заставки нет — разумный размер, не больше 240 px. */
      (function () {
        try {
          var W = window.innerWidth, H = window.innerHeight, S = 0.26;
          var cap = window.Capacitor;
          var platform = cap && cap.getPlatform ? cap.getPlatform() : 'web';
          var size;
          if (platform === 'ios') {
            size = S * Math.max(W, H);
          } else if (platform === 'android') {
            // Системная заставка Android: медальон 192 dp по центру
            // (generate-brand-assets.py); в веб-вью 1 CSS px = 1 dp.
            size = 192;
          } else {
            size = Math.min(S * Math.max(W, H), 240);
          }
          document.documentElement.style.setProperty('--launch-size', Math.round(size) + 'px');
        } catch (e) { /* --launch-size по умолчанию 160px */ }
      })();
      /* Страховка без JS приложения. Если бандл не загрузился (чанк 404 после
         деплоя, старый WebKit споткнулся на синтаксисе), window.onerror его
         не увидит — ошибка уходит на тег <script>, — и заставка перекрыла бы
         экран навсегда, перехватывая касания. Через 10 с, если #launch ещё
         здесь, а React так ничего и не отрисовал, показываем повтор. */
      setTimeout(function () {
        var launch = document.getElementById('launch');
        var root = document.getElementById('root');
        if (!launch || (root && root.firstChild)) return;
        launch.className = 'launch--failed';
        var box = document.createElement('div');
        box.className = 'launch-failed';
        box.setAttribute('role', 'alert');
        var text = document.createElement('p');
        text.textContent = 'Не удалось загрузить приложение.';
        var button = document.createElement('button');
        button.type = 'button';
        button.textContent = 'Перезагрузить';
        button.onclick = function () { location.reload(); };
        box.appendChild(text);
        box.appendChild(button);
        launch.appendChild(box);
        launch.removeAttribute('aria-hidden');
      }, 10000);
    </script>
    <!--
      Тема ставится ДО первого кадра, а не в эффекте React.
      Иначе на тёмных темах холодный старт даёт светлую вспышку: первый
      кадр рисуется палитрой :root по умолчанию (она светлая), а
      `body { transition: background-color .2s }` растягивает подмену ещё
      на 200 мс — и вспышка доезжает уже после снятия нативной заставки.
      Логика повторяет readStoredTheme() из src/hooks/useTheme.ts, включая
      миграцию значений, оставшихся от QuranIng. Держать её здесь
      приходится потому, что модуль к этому моменту ещё не выполнен.
    -->
    <script>
      (function () {
        try {
          var VALID = ['light', 'dark', 'aurora', 'aurora2', 'cosmos'];
          var FIRST_RUN = 'aurora';
          var v = localStorage.getItem('theme');
          var t = FIRST_RUN;
          if (v) {
            if (VALID.indexOf(v) !== -1) {
              t = v;
            } else if (v === 'mushaf') {
              // Тема «Бумага» снята (владелец 2026-10-04) — светлая ближе всего.
              t = 'light';
            } else if (v.indexOf('cosmic') === 0) {
              t = 'aurora2';
            } else if (v.indexOf('light') === 0) {
              t = 'light';
            } else if (v.indexOf('dark') === 0) {
              t = 'dark';
            } else if (v === 'parchment' || v === 'sepia') {
              t = 'light';
            }
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'aurora');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
